<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML PPT Toolkit Demo</title>
  <link rel="stylesheet" href="../editor/html-ppt-editor.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172632;font-family:"Microsoft YaHei UI",sans-serif}.viewport{position:fixed;inset:0}.deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#f5efe3;box-shadow:0 30px 90px #0008}.slide{position:absolute;inset:0;display:none;padding:100px 120px;background:linear-gradient(135deg,#f8f4eb,#edf3ef)}.slide.active{display:block}.kicker{font-size:26px;font-weight:900;color:#3f8588}.title{max-width:1400px;margin:42px 0 26px;font-size:88px;line-height:1.08;color:#10283b}.lead{max-width:1200px;font-size:36px;line-height:1.55;color:#38566a}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:70px}.card{min-height:300px;padding:38px;border:1px solid #c8d3ce;border-radius:28px;background:#fff;box-shadow:0 14px 36px #10283b16}.card h3{font-size:42px;margin:0 0 22px}.card p{font-size:27px;line-height:1.55}.accent{color:#d76432}.page{position:absolute;right:60px;bottom:40px;font-size:22px;font-weight:900;color:#58717c}.step,[data-step]{opacity:0;visibility:hidden;transition:.25s}.step.shown,[data-step].shown,.static-mode .step,.static-mode [data-step]{opacity:1;visibility:visible}.nav{position:absolute;inset:0;z-index:20;pointer-events:none}.nav button{position:absolute;top:0;bottom:0;width:8%;opacity:0;pointer-events:auto}.nav .prev{left:0}.nav .next{right:0}
  </style>
</head>
<body><main class="viewport"><div class="deck" id="deck" data-ppt-deck>
  <section class="slide active" id="P01" data-ppt-slide><div class="kicker" data-ppt-editable data-ppt-draggable>HTML PPT TOOLKIT</div><h1 class="title" data-ppt-editable data-ppt-draggable>一套工具栏，服务以后所有网页版 PPT</h1><p class="lead" data-ppt-editable data-ppt-draggable>文字、图片、位置、尺寸和动画顺序，都可以在浏览器里继续调整。</p><div class="page" data-ppt-protected>P01</div></section>
  <section class="slide" id="P02" data-ppt-slide><div class="kicker" data-ppt-editable>通用编辑能力</div><h1 class="title" data-ppt-editable>不依赖某一套课程内容</h1><div class="cards"><article class="card" data-ppt-draggable data-ppt-anim data-step><h3 data-ppt-editable>编辑</h3><p data-ppt-editable>修改文字、字号、颜色和图片。</p></article><article class="card" data-ppt-draggable data-ppt-anim data-step><h3 data-ppt-editable>排版</h3><p data-ppt-editable>拖动、缩放、对齐和撤回。</p></article><article class="card" data-ppt-draggable data-ppt-anim data-step><h3 data-ppt-editable>交付</h3><p data-ppt-editable>导出 HTML、PDF 和可编辑 PPTX。</p></article></div><div class="page" data-ppt-protected>P02</div></section>
  <section class="slide" id="P03" data-ppt-slide><div class="kicker" data-ppt-editable>Agent 协作</div><h1 class="title" data-ppt-editable>初稿由 Agent 生成，细节由你掌控</h1><p class="lead" data-ppt-editable>统一页面契约后，Codex、Claude 或其他 Agent 都能继续修改，而不会破坏浏览器编辑状态。</p><div class="page" data-ppt-protected>P03</div></section>
  <div class="nav" data-ppt-protected><button class="prev"></button><button class="next"></button></div>
</div></main><script>
  (function(){var deck=document.getElementById('deck'),slides=[...deck.querySelectorAll('.slide')],index=0,state=new Map();function fit(){deck.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}function steps(i){return[...slides[i].querySelectorAll('[data-step]')].sort((a,b)=>(+a.dataset.stepOrder||999)-(+b.dataset.stepOrder||999))}function apply(){var n=state.get(index)||0;steps(index).forEach((el,i)=>el.classList.toggle('shown',i<n))}function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===index));state.set(index,0);apply()}function next(){var n=state.get(index)||0;if(n<steps(index).length){state.set(index,n+1);apply()}else show(index+1)}function prev(){var n=state.get(index)||0;if(n>0){state.set(index,n-1);apply()}else show(index-1)}document.addEventListener('keydown',e=>{if(document.documentElement.classList.contains('hppt-editing'))return;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}});deck.querySelector('.next').onclick=next;deck.querySelector('.prev').onclick=prev;window.go=show;window.__getVisibleSlides=()=>slides;window.pptStepApi={refresh:function(reset){if(reset)state.set(index,0);apply()}};addEventListener('resize',fit);fit();show(0)})();
  </script><script src="../editor/html-ppt-editor.js"></script>
</body></html>
